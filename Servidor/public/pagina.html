<!DOCTYPE html>
<html>
    <head>
        <title>Servidor</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Servidor</h1>
        <p>Fagner Pimentel</p>

        <h2>Exemplo de get/post</h2>
        <form action="/cadastrar">
            <p>Nome: <input type="text" name="nome"> </p>
            <p>Login: <input type="text" name="login"> </p>
            <p>Senha: <input type="password" name="senha"> </p>
            <input type="submit" value="Enviar com Get" formmethod="get">
            <input type="submit" value="Enviar vom Post" formmethod="post">
        </form>

        <h2>Exemplo de FOR no EJS</h2>
        <form action="/for" method="get">
            <p>Qtde de DIVs: <input type="number" name="qtde"></p>
            <input type="submit">
        </form>

    </body>
</html>
